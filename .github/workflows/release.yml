name: Release

# Three independent products, each released on its own:
#   sdk  @jeevanand/agent-browserbox-sdk + @jeevanand/agent-browserbox-runtime
#        (npm, always the same version, packages/*/package.json); tag sdk-v1.2.3.
#        The runtime is also served at /runtime/<version>/ on the site.
#   agent @jeevanand/agent-browserbox (npm, packages/agent/package.json); tag agent-v1.2.3.
#   app  the BrowserBox app (root package.json); tag app-v1.2.3. Not on npm:
#        released as a site zip and served at /agent/, /os/, /docs/.
# Start it from the Actions tab (Run workflow), which releases the version in
# package.json and creates the tag, or by pushing such a tag.
#
# SDK and app releases end by reassembling the site from all releases (pages.yml).
# A release only adds its own part; nothing is ever built from a push.
on:
  push:
    tags: ['sdk-v*', 'agent-v*', 'app-v*']
  workflow_dispatch:
    inputs:
      release:
        description: What to release
        type: choice
        options: [sdk, agent, app]
        default: sdk

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.what.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Work out what to release
        id: what
        env:
          INPUT: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            kind="$INPUT"
            case "$kind" in
              sdk) tag="sdk-v$(node -p "require('./packages/sdk/package.json').version")" ;;
              agent) tag="agent-v$(node -p "require('./packages/agent/package.json').version")" ;;
              *) tag="app-v$(node -p "require('./package.json').version")" ;;
            esac
          else
            tag="$GITHUB_REF_NAME"
            kind="${tag%%-v*}"
          fi
          version="${tag#*-v}"
          case "$kind" in
            sdk) files="packages/sdk/package.json packages/runtime/package.json"; changelog=packages/sdk/CHANGELOG.md ;;
            agent) files="packages/agent/package.json"; changelog=packages/agent/CHANGELOG.md ;;
            *) files="package.json"; changelog=CHANGELOG.md ;;
          esac
          for f in $files; do
            have=$(node -p "require('./$f').version")
            if [ "$have" != "$version" ]; then
              echo "::error::$tag does not match $f version $have"
              exit 1
            fi
          done
          {
            echo "kind=$kind"
            echo "tag=$tag"
            echo "version=$version"
            echo "changelog=$changelog"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $kind as $tag"

      - name: Check that NPM_TOKEN is configured
        if: steps.what.outputs.kind != 'app'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret: an npm automation token that can publish under @jeevanand."
            exit 1
          fi

      # A manual run for a version that already has a tag rebuilds that tag's
      # code, so a rerun only refreshes the release page and its assets.
      - name: Use the tagged code if the tag exists
        env:
          TAG: ${{ steps.what.outputs.tag }}
          CHANGELOG: ${{ steps.what.outputs.changelog }}
        run: |
          # Release notes always come from the newest changelog, so they can be improved later.
          cp "$CHANGELOG" "$RUNNER_TEMP/CHANGELOG.md"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "building $TAG ($(git rev-parse --short HEAD))"
          fi

      - run: npm ci
      - run: npm test

      # ---- sdk: SDK + runtime to npm, runtime zip to the release ------------------
      - name: Test the SDK against the runtime
        if: steps.what.outputs.kind == 'sdk'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run build:sdk && npm run build:runtime && node scripts/sdk-e2e.mjs

      - name: Publish the SDK and the runtime
        if: steps.what.outputs.kind == 'sdk'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          # The runtime first: an SDK must never be on npm without its runtime.
          for p in @jeevanand/agent-browserbox-runtime @jeevanand/agent-browserbox-sdk; do
            if [ "$(npm view "$p@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$p@$VERSION is already on npm; not publishing it again"
            else
              npm publish --provenance --access public -w "$p"
            fi
          done

      # ---- agent: to npm (it needs the SDK version it names to be on npm) -----------
      - name: Test the agent against a real box
        if: steps.what.outputs.kind == 'agent'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run build:agent && npm run build:runtime && node scripts/sdk-e2e.mjs

      - name: Publish the agent
        if: steps.what.outputs.kind == 'agent'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          p=@jeevanand/agent-browserbox
          if [ "$(npm view "$p@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$p@$VERSION is already on npm; not publishing it again"
          else
            npm publish --provenance --access public -w "$p"
          fi

      # ---- app: the built site, zipped ---------------------------------------------
      - name: Build the app
        if: steps.what.outputs.kind == 'app'
        run: npm run build

      # ---- both: notes, asset, GitHub release --------------------------------------
      - name: Prepare the release notes and asset
        id: asset
        env:
          KIND: ${{ steps.what.outputs.kind }}
          VERSION: ${{ steps.what.outputs.version }}
          CHANGELOG: ${{ steps.what.outputs.changelog }}
        run: |
          # What's new: this version's section of the changelog (leading blank lines dropped).
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / && on { exit } on' "$RUNNER_TEMP/CHANGELOG.md" | sed '/./,$!d' > whats-new.md
          if [ ! -s whats-new.md ]; then
            echo "::error::$CHANGELOG has no '## $VERSION' section"
            exit 1
          fi
          site=https://jeevanandmaurya.github.io/agent-browserbox
          if [ "$KIND" = sdk ]; then
            title="agent-browserbox $VERSION: SDK + runtime"
            zip="agent-browserbox-runtime-$VERSION.zip"
            (cd packages/runtime/dist && zip -qr "../../../$zip" .)
            {
              echo "Two packages, always released together with the same version:"
              echo
              echo "| Package | What it is |"
              echo "|---|---|"
              echo "| [\`@jeevanand/agent-browserbox-sdk@$VERSION\`](https://www.npmjs.com/package/@jeevanand/agent-browserbox-sdk/v/$VERSION) | The SDK your app imports. 3 kB, no dependencies. |"
              echo "| [\`@jeevanand/agent-browserbox-runtime@$VERSION\`](https://www.npmjs.com/package/@jeevanand/agent-browserbox-runtime/v/$VERSION) | The runtime the SDK drives, for self-hosting. |"
              echo
              echo '```bash'
              echo "npm install @jeevanand/agent-browserbox-sdk@$VERSION"
              echo '```'
              echo
              echo "The SDK uses the hosted runtime of its own version ($site/runtime/$VERSION/) by default. To host it yourself, run \`npx @jeevanand/agent-browserbox-runtime@$VERSION\`, or unzip **$zip** below onto any static host and pass its URL as \`runtimeUrl\`. Use the same version of the SDK and the runtime."
              echo
              echo "## What's new"
              echo
              cat whats-new.md
            } > release-notes.md
          elif [ "$KIND" = agent ]; then
            title="agent-browserbox $VERSION: the agent"
            zip=""
            {
              echo "[\`@jeevanand/agent-browserbox@$VERSION\`](https://www.npmjs.com/package/@jeevanand/agent-browserbox/v/$VERSION): an AI agent that works inside a BrowserBox."
              echo
              echo '```bash'
              echo "npm install @jeevanand/agent-browserbox@$VERSION @jeevanand/agent-browserbox-sdk"
              echo '```'
              echo
              echo "## What's new"
              echo
              cat whats-new.md
            } > release-notes.md
          else
            title="BrowserBox app $VERSION"
            zip="browserbox-app-$VERSION.zip"
            (cd apps/browserbox/dist && zip -qr "../../../$zip" .)
            {
              echo "The BrowserBox app: an agent OS in the browser. Open it at $site/agent/."
              echo
              echo "To host it yourself, unzip **$zip** below onto any static host and open \`agent/\`."
              echo
              echo "## What's new"
              echo
              cat whats-new.md
            } > release-notes.md
          fi
          cat release-notes.md
          if [ -n "$zip" ]; then unzip -l "$zip" | tail -1; fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
          TITLE: ${{ steps.asset.outputs.title }}
          ZIP: ${{ steps.asset.outputs.zip }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            if [ -n "$ZIP" ]; then gh release upload "$TAG" "$ZIP" --clobber; fi
          else
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TITLE" --notes-file release-notes.md $ZIP
          fi

  # Put the new release on the site (it is assembled from all releases).
  site:
    needs: publish
    # The agent is not on the site; only SDK and app releases change it.
    if: needs.publish.outputs.kind != 'agent'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
