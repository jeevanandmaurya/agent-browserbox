name: Release to npm

# What is released:
#   app  @jeevanand/browserbox (root package.json); tag v1.2.3
#   sdk  @jeevanand/agent-browserbox and @jeevanand/agent-browserbox-runtime
#        (always the same version, packages/*/package.json); tag sdk-v1.2.3
# Start it by pushing such a tag, or from the Actions tab (Run workflow), which
# releases the version in package.json and creates the tag.
on:
  push:
    tags: ['v*', 'sdk-v*']
  workflow_dispatch:
    inputs:
      release:
        description: What to release
        type: choice
        options: [sdk, app]
        default: sdk

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check that NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret: an npm automation token that can publish under @jeevanand."
            exit 1
          fi

      - name: Work out what to release
        id: what
        env:
          INPUT: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            kind="$INPUT"
            if [ "$kind" = sdk ]; then tag="sdk-v$(node -p "require('./packages/sdk/package.json').version")"
            else tag="v$(node -p "require('./package.json').version")"; fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" == sdk-v* ]]; then kind=sdk; else kind=app; fi
          fi
          if [ "$kind" = sdk ]; then
            want="${tag#sdk-v}"
            for p in packages/sdk packages/runtime; do
              have=$(node -p "require('./$p/package.json').version")
              if [ "$have" != "$want" ]; then
                echo "::error::$tag does not match $p/package.json version $have (the SDK and the runtime share a version)"
                exit 1
              fi
            done
          else
            have=$(node -p "require('./package.json').version")
            if [ "v$have" != "$tag" ]; then
              echo "::error::tag $tag does not match package.json version $have"
              exit 1
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $kind as $tag"

      - run: npm ci
      - run: npm test

      - name: Publish the app
        if: steps.what.outputs.kind == 'app'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Test the SDK against the runtime
        if: steps.what.outputs.kind == 'sdk'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run build:sdk && npm run build:runtime && node scripts/sdk-e2e.mjs

      - name: Publish the SDK and the runtime
        if: steps.what.outputs.kind == 'sdk'
        run: |
          npm publish --provenance --access public -w @jeevanand/agent-browserbox-runtime
          npm publish --provenance --access public -w @jeevanand/agent-browserbox
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
