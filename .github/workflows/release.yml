name: Release to npm

# Push a tag vX.Y.Z after setting that version in packages/sdk and packages/app.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches both packages
        run: |
          for pkg in sdk app; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match packages/$pkg version $version"
              exit 1
            fi
          done

      - name: Check that NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an NPM_TOKEN repository secret: an npm automation token that can publish @jeevanand/browserbox and @jeevanand/browserbox-app."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:sdk

      - name: Publish the SDK (@jeevanand/browserbox)
        run: npm publish ./packages/sdk --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish the app (@jeevanand/browserbox-app)
        working-directory: packages/app
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
