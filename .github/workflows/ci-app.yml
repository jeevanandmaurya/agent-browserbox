name: CI · app

# Tests and builds the BrowserBox app when its code changes. Deploys nothing:
# app releases do that (release.yml, app-v*).
on:
  push:
    branches: [main]
    paths:
      - 'apps/browserbox/**'
      - 'tests/**'
      - 'scripts/smoke.mjs'
      - 'scripts/features.mjs'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - '.github/workflows/ci-app.yml'
  pull_request:
    paths:
      - 'apps/browserbox/**'
      - 'tests/**'
      - 'scripts/smoke.mjs'
      - 'scripts/features.mjs'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - '.github/workflows/ci-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
