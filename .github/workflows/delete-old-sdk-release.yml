name: Delete the old sdk-v0.1.0 release (one-off)

# sdk-v0.1.0 was released under the SDK's old name (@jeevanand/agent-browserbox).
# Deleting it lets the release workflow tag and publish the renamed
# @jeevanand/agent-browserbox-sdk@0.1.0. Removed once it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the sdk-v0.1.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sdk-v0.1.0 --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || echo "no sdk-v0.1.0 release"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/sdk-v0.1.0" || echo "no sdk-v0.1.0 tag left"
